package:
  name: bash
  version: "5.3"
  epoch: 4
  description: "GNU bourne again shell"
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - merged-bin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ncurses-dev
  environment:
    # Should be able to drop this once v5.3 is released
    CFLAGS: -std=c17

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.fu-berlin.de/unix/gnu/bash/bash-${{package.version}}.tar.gz
      expected-sha256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba

  - runs: |
      export CFLAGS="${CFLAGS} -DSYS_BASHRC='\"/etc/bash.bashrc\"' -DSYS_BASH_LOGOUT='\"/etc/bash.bash_logout\"'"
      ./configure \
        --host=${{host.triplet.gnu}} \
        --target=${{host.triplet.gnu}} \
        --prefix=/usr \
        --bindir=/usr/bin \
        --sysconfdir=/etc \
        --without-libidn \
        --with-ssl=openssl \
        --disable-nls \
        --enable-readline \
        --without-bash-malloc \
        --with-curses

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: bash-binsh
    dependencies:
      provider-priority: 60
      runtime:
        - bash
        - merged-bin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          ln -s bash "${{targets.subpkgdir}}"/usr/bin/sh
    test:
      pipeline:
        - runs: |
            [ /usr/bin/sh -ef /usr/bin/bash ]
            sh --version
            sh --help

  - name: "bash-doc"
    description: "bash documentation"
    pipeline:
      - uses: split/manpages
      - uses: split/infodir
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          mv "${{targets.destdir}}"/usr/share/doc "${{targets.subpkgdir}}"/usr/share/
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-bin
        - wolfi-baselayout

  - name: "bash-dev"
    description: "bash development headers"
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/bashbug "${{targets.subpkgdir}}"/usr/bin/
    test:
      pipeline:
        - runs: |
            bashbug --version
            bashbug --help
        - uses: test/pkgconf
    dependencies:
      runtime:
        - merged-bin
        - wolfi-baselayout

  - name: "bash-builtins"
    description: "bash loadable builtins"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv "${{targets.destdir}}/usr/lib/bash" ${{targets.subpkgdir}}/usr/lib/
    test:
      environment:
        contents:
          packages:
            - bash
      pipeline:
        - name: Test loadable builtins
          runs: |
            # Verify builtins directory exists
            stat /usr/lib/bash

            # Test print builtin
            stat /usr/lib/bash/print
            output=$(bash -c 'enable -f /usr/lib/bash/print print && print "test output"')
            [ "$output" = "test output" ]

            # Test basename builtin
            stat /usr/lib/bash/basename
            result=$(bash -c 'enable -f /usr/lib/bash/basename basename && basename /path/to/file.txt')
            [ "$result" = "file.txt" ]
    dependencies:
      runtime:
        - bash
        - merged-bin
        - wolfi-baselayout

update:
  enabled: true
  release-monitor:
    identifier: 166

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: bash
    - uses: test/tw/help-check
      with:
        bins: bash
    - name: Test basic echo command
      runs: |
        out=$(/usr/bin/bash -c "echo hello world")
        [ "$out" = "hello world" ]
    - name: Test variable assignment and expansion
      runs: |
        result=$(bash -c 'x=5; echo $x')
        [ "$result" = "5" ]
    - name: Test conditionals
      runs: |
        result=$(bash -c 'if [ 1 -eq 1 ]; then echo pass; else echo fail; fi')
        [ "$result" = "pass" ]
    - name: Test loops
      runs: |
        result=$(bash -c 'for i in 1 2 3; do echo -n $i; done')
        [ "$result" = "123" ]
    - name: Test command substitution
      runs: |
        result=$(bash -c 'x=$(echo test); echo $x')
        [ "$result" = "test" ]
    - name: Test pipes
      runs: |
        result=$(bash -c 'echo hello | grep hello')
        [ "$result" = "hello" ]
    - name: Test shell builtins
      runs: |
        # Test cd builtin
        [ "$(bash -c 'cd /tmp && pwd')" = "/tmp" ]

        # Test the test builtin
        bash -c 'test -d /tmp'
    - name: Test executing script from file
      runs: |
        # Create a test script
        cat > /tmp/test_script.sh <<'EOF'
        #!/usr/bin/bash
        echo "script executed successfully"
        EOF

        chmod +x /tmp/test_script.sh

        # Execute the script and verify output
        result=$(bash /tmp/test_script.sh)
        [ "$result" = "script executed successfully" ]
